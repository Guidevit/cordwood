name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow starts this on the version branch: a pull request opened by a workflow
  # triggers no run of its own, and main takes no merge without this check.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The Firebase emulators the tests run in need Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      # Build first: a package reads the types of the ones it depends on from their dist.
      - run: pnpm build
      # The build rewrites the component registry: what is committed must be what the source gives.
      - run: git diff --exit-code registry/r
      - run: pnpm typecheck
      - run: pnpm test
