name: Release

on:
  push:
    branches: [main]

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Starts CI on the version branch.
      actions: write
      # npm trusts this workflow by its OIDC identity: no token is stored anywhere.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Trusted publishing needs npm 11.5.1 or later, and Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # Opens a "Version Packages" pull request while changesets are pending,
      # and publishes to npm once that pull request is merged.
      # Skipped in a fork: npm trusts this repository only.
      - uses: changesets/action@v1
        id: changesets
        if: github.repository == 'Guidevit/cordwood'
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the version pull request
        if: steps.changesets.outputs.pullRequestNumber != ''
        run: gh workflow run ci.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
